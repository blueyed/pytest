language: python
dist: xenial
python: '3.7.4'
cache: false

env:
  global:
    - PYTEST_ADDOPTS="-vv --showlocals --durations=50"
    - COVERAGE_FILE="$PWD/.coverage"
    - COVERAGE_PROCESS_START="$PWD/.coveragerc"
    - _PYTEST_TOX_COVERAGE_RUN="coverage run -m"
    - _PYTEST_TOX_EXTRA_DEP=coverage-enable-subprocess

# setuptools-scm needs all tags in order to obtain a proper version
git:
  depth: false

install:
  - python -m pip install git+https://github.com/blueyed/tox@master

jobs:
  include:
    # Coverage for Python 3.5.{0,1} specific code, mostly typing related.
    - env:
        - TOXENV=py35
        - PYTEST_ADDOPTS="-k test_raises_cyclic_reference"
      python: '3.5.1'
      dist: trusty
      before_install:
        - python -m pip install -U pip

before_script:
  - |
  - python -m tox --notest -v --durations

script:
  - env COLUMNS=130 python -m tox -v --durations
  - env CODECOV_NAME="$TOXENV-$TRAVIS_OS_NAME" scripts/report-coverage.sh -F Travis

branches:
  only:
    - my-master
