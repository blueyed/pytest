comment: false
codecov:
  notify:
    after_n_builds: 12
    wait_for_ci: true
coverage:
  status:
    changes: true
    patch:
      default:
        target: 100%
    # Split project status into tests and app.
    project:
      default: false
      app:
        paths:
          - "!testing/"
      tests:
        paths:
          - "testing/"
