image: freebsd/12.x

sources:
  - https://github.com/blueyed/pytest

packages:
  - py36-tox

environment:
  TOXENV: py36-lsof-pexpect-numpy-twisted
  PYTEST_COVERAGE: 1
  PYTEST_ADDOPTS: -m uses_pexpect

tasks:
  - install: |
      cd pytest
      tox --notest

  - test: |
      cd pytest
      tox -vv
