version = 1

test_patterns = [
    "testing/test_*.py",
    "testing/*_test.py",
    "testing/**/test_*.py",
    "testing/**/*_test.py",
    "testing/python/*.py",
]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"
  type_checker = "mypy"

[[analyzers]]
name = "test-coverage"
enabled = true
